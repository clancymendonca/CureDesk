name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip install -r services/api/requirements-dev.txt
      - name: Download ML data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kagglehub pandas
          python ml/scripts/download_data.py --dataset symptoms --skip-kaggle-check || \
            python ml/scripts/download_data.py --dataset symptoms --allow-synthetic
      - name: Train ML artifacts
        run: python ml/train_symptoms.py --cpu --skip-quality-gate
      - name: Assert metrics.json
        run: |
          python -c "
          import json
          from pathlib import Path
          p = Path('services/api/models/artifacts/metrics.json')
          assert p.exists(), 'metrics.json missing'
          m = json.loads(p.read_text())
          assert m.get('n_classes', 0) >= 6
          assert m.get('cv_top3_accuracy', 0) >= 0.20 or m.get('n_classes', 0) <= 6
          print('metrics ok', m.get('model_version'), 'classes', m.get('n_classes'))
          "
      - name: Pytest
        working-directory: services/api
        env:
          DATABASE_URL: sqlite://
          ARTIFACTS_DIR: models/artifacts
        run: python -m pytest tests/ -q

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML deps
        run: pip install -r ml/requirements.txt pandas scikit-learn joblib numpy xgboost
      - name: Download and train symptoms
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kagglehub
          python ml/scripts/download_data.py --dataset symptoms --skip-kaggle-check || \
            python ml/scripts/download_data.py --dataset symptoms --allow-synthetic
          python ml/train_symptoms.py --cpu --skip-quality-gate
      - name: Eval symptoms
        run: python ml/eval_symptoms.py
      - name: OCR eval
        run: python ml/eval_ocr.py
      - name: Quality gate
        run: |
          python -c "
          import json
          from pathlib import Path
          m = json.loads(Path('services/api/models/artifacts/metrics.json').read_text())
          assert m['cv_top3_accuracy'] >= 0.20 or m['n_classes'] <= 6, m
          print('ML quality gate passed')
          "

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build web
        env:
          # Placeholder values so Firebase client init doesn't fail during prerender.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build --filter=@curedesk/web
